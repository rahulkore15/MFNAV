name: MFNAV Daily NAV Capture
on:
  schedule:
    - cron: '10 17 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test MutualFundNAV --reporter=list
      - name: Commit CSV history
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add nav-history.csv || true
          git diff --staged --quiet || git commit -m "Auto-update NAV $(date -u +%Y-%m-%d)"
          git push || echo "No changes to push"
