name: MFNAV Daily NAV Capture
on:
  schedule:
    - cron: '10 17 * * *' # 10:40 PM IST = 5:10 PM UTC
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright
        run: npx playwright install chromium --with-deps
      - name: Run ONLY MutualFundNAV test
        run: npx playwright test tests/MutualFundNAV.spec.ts --project=chromium --reporter=list
      - name: Upload NAV CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nav-history
          path: nav-history.csv
